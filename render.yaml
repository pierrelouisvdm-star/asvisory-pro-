services:
  - type: web
    name: advisorypro-api
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: advisorypro
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_LLM_MODEL
        value: gpt-4o
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: noreply@advisorypro.co.za
      - key: ADMIN_EMAIL
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: CORS_ORIGINS
        value: https://advisorypro.co.za,https://www.advisorypro.co.za,https://asvisory-pro-ff29.vercel.app
